# V1 Config - Simple baseline with average pooling + MLP

run_config:
  mode: "full_pipeline"  # full_pipeline | pretrain_only | finetune_from_pretrain | eval_only
  seed: 47
  pretrain_run_id: null   # Auto-timestamp if null
  finetune_run_id: null   # Auto-timestamp if null
  eval_run_id: null       # Auto-timestamp if null
  load_checkpoint_path: null  # If mode = full_pipeline, then NULL checkpoint.
                              # If mode = finetune_from_pretrain, then the checkpoint of the pretrain run.
                              # If mode = eval_only, then the checkpoint of the finetune run.
  save_best_only: true     # If true, only save the best checkpoint. If not, save checkpoint at every epoch end, while also keeps a best model checkpoint.

top_level_config:
  device: "cuda"
  ddp:
    enabled: true         # Enable DistributedDataParallel by default
    backend: "nccl"       # nccl | gloo (cpu)
    init_method: "env://"
    find_unused_parameters: false  # V1 is simple, no dynamic grad toggles

data_config:
  embeddings_path: "data/TMP/processed/TMP_embeddings.npz"
  embedding_dtype: "bf16"
  max_sequence_length: 768
  dataloader:
    num_workers: 0
    prefetch_factor: null
    persistent_workers: false
    pin_memory: false
    drop_last: false

  pretrain:
    train_csv: "data/TMP/processed/pretrain_train_balanced.csv"
    valid_csv: "data/TMP/processed/pretrain_val_balanced.csv"
  finetune:
    train_csv: "data/TMP/processed/finetune_train.csv"
    valid_csv: "data/TMP/processed/finetune_val.csv"
    sampling:
      strategy: "imbalanced"
      pos_neg_ratio: 10.0
    distribution_alignment:
      target_prior: 0.10
      threshold_search_metric: "auprc"
      search_steps: 200
  evaluate:
    test_balanced: "data/TMP/processed/test.csv"

model_config:
  model: "v1"
  input_dim: 1536
  
  # MLP head configuration (V1 uses single hidden_dim)
  mlp_head:
    hidden_dim: 256
  
  # Regularization (V1 only uses dropout)
  regularization:
    dropout: 0.2

pretrain_config:
  epochs: 30
  batch_size: 32

  # Logging configuration
  log_every_n_batches: 100
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auprc
    secondary: auroc
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: true
  
  # Early stopping
  early_stopping_patience: 5
  monitor_metric: "loss"     # Which metric to use for early stopping (lower is better)
  
  # Scheduler settings
  scheduler:
    type: "onecycle"
    max_lr: 0.0001
    pct_start: 0.20
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
  
  # Optimizer
  optimizer:
    type: "adamw"
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.01
  
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.02
    use_class_weights: true
    l1_lambda: 0.0

finetune_config:
  strategy:
    type: "staged_unfreeze"  # head_only | full | staged_unfreeze
    schedule:
      # Initial freeze: start finetune with encoder frozen (head-only training)
      - at_epoch: 0
        freeze: ["protein_encoder."]
      # Staged unfreeze: unfreeze encoder after 3 epochs
      - at_epoch: 3
        unfreeze: ["protein_encoder."]

  epochs: 15
  batch_size: 32

  # Logging configuration
  log_every_n_batches: 50
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auprc
    secondary: auroc
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: true
  
  # Early stopping
  early_stopping_patience: 5
  monitor_metric: "loss"     # Which metric to use for early stopping (lower is better)
  
  scheduler:
    type: "warmup_cosine"
    warmup_epochs: 3
    num_cycles: 0.5
  
  # Optimizer with LLRD (Layer-wise Learning Rate Decay)
  optimizer:
    type: "adamw"
    lr: 0.00001                # Base LR for unmatched parameters
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.01         # Base weight_decay for unmatched parameters
    # LLRD: Different learning rates for V1 components
    param_groups:
      - name: "head"
        pattern: "interaction_head."
        lr: 0.00004
        weight_decay: 0.0      # No weight decay on task head
      - name: "encoder"
        pattern: "protein_encoder."
        lr: 0.00002           # Lower LR for encoder
        weight_decay: 0.015
  
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.02
    use_class_weights: true
    l1_lambda: 0.0
  
evaluate:
  metrics: [
    "auroc",
    "auprc",
    "accuracy",
    "sensitivity",
    "specificity",
    "precision",
    "recall",
    "f1",
    "mcc",
  ]
  apply_distribution_alignment: false