run_config:
  stages: ["pretrain", "finetune", "evaluate"]
  seed: 47
  train_run_id: null
  finetune_run_id: null
  eval_run_id: null
  load_checkpoint_path: null
  save_best_only: true

device_config:
  device: "cuda"
  ddp_enabled: true
  use_mixed_precision: true

data_config:
  benchmark:
    name: "TMP"
    root_dir: "data/TMP"
    processed_dir: "data/TMP/processed"
  embeddings:
    source: "esm3"
    cache_dir: "data/embeddings/esm3"
  max_sequence_length: 1024
  preprocessing:
    tppni:
      enabled: true
      force_rebuild: false
      candidate_limit: 10000000
      pretrain:
        source_dataset: "data/TMP/processed/pretrain.csv"
        train_ratio: 0.95
        train_dataset: "data/TMP/processed/pretrain_train.csv"
        valid_dataset: "data/TMP/processed/pretrain_val.csv"
      finetune:
        source_dataset: "data/TMP/processed/finetune.csv"
        train_ratio: 0.90
        train_dataset: "data/TMP/processed/finetune_train.csv"
        valid_dataset: "data/TMP/processed/finetune_val.csv"
  dataloader:
    train_dataset: "data/TMP/processed/pretrain_train.csv"
    valid_dataset: "data/TMP/processed/pretrain_val.csv"
    finetune_train_dataset: "data/TMP/processed/finetune_train.csv"
    finetune_val_dataset: "data/TMP/processed/finetune_val.csv"
    test_dataset: "data/TMP/processed/test.csv"
    num_workers: 2
    pin_memory: false
    persistent_workers: false
    prefetch_factor: 1
    drop_last: true
    sampling:
      strategy: "ohem"  # none | ohem
      warmup_epochs: 3
      pool_multiplier: 8
      cap_protein: 4
    pretrain_sampling:
      strategy: "none"  # none | ohem

model_config:
  model: "v3"
  input_dim: 1536
  d_model: 512
  encoder_layers: 4
  cross_attn_layers: 4
  n_heads: 8
  mlp_head:
    hidden_dims: [512, 256, 128]
    dropout: 0.20
    activation: "gelu"
    norm: "layernorm"
  regularization:
    dropout: 0.10
    token_dropout: 0.10
    cross_attention_dropout: 0.10
    stochastic_depth: 0.10

training_config:
  epochs: 10
  batch_size: 32
  early_stopping_patience: 3
  monitor_metric: "auprc"
  logging:
    validation_metrics: ["auprc", "auroc", "f1", "accuracy"]
  optimizer:
    type: "adamw"
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.05
  scheduler:
    type: "onecycle"
    max_lr: 0.0001
    pct_start: 0.15
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.05
  strategy:
    type: "none"
  finetune:
    batch_size: 32
    epochs: 30
    early_stopping_patience: 4
    monitor_metric: "auprc"
    optimizer:
      lr: 0.00002
      weight_decay: 0.05
    scheduler:
      max_lr: 0.00002
      pct_start: 0.15
    loss:
      pos_weight: 1.0
      label_smoothing: 0.01
    strategy:
      type: "staged_unfreeze"
      unfreeze_epoch: 2
      initial_trainable_prefixes: ["output_head"]

domain_adaptation:
  method: "none"
  target_split: "test"
  compare_pre_post: true
  shot:
    epochs: 5
    beta: 0.3
    entropy_weight: 0.1
    align_weight: 3.0
    tau_pos: 0.93
    tau_neg: 0.995
    pos_weight: 5.0
    neg_weight: 1.0
    normalize_class_weights: true
    prior_pos: 0.025
    prior_ema_momentum: 0.02
    lr: 5.0e-5
    momentum: 0.9
    weight_decay: 3.0e-4
    lr_gamma: 10.0
    lr_power: 0.75
    refine_rounds: 1
    class_count_threshold: 2
    use_amp: true

evaluate:
  metrics:
    - "auroc"
    - "auprc"
    - "accuracy"
    - "sensitivity"
    - "specificity"
    - "precision"
    - "recall"
    - "f1"
    - "mcc"
