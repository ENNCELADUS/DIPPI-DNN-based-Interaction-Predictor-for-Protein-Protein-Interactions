# TUnA Model Configuration
# Aligned with original TUnA architecture from TUnA/results/bernett/TUnA/config.yaml

run_config:
  mode: "full_pipeline"
  seed: 47
  pretrain_run_id: null
  finetune_run_id: null
  eval_run_id: null
  load_checkpoint_path: null
  save_best_only: true

top_level_config:
  device: "cuda"
  ddp:
    enabled: true
    backend: "nccl"
    init_method: "env://"
    find_unused_parameters: true

data_config:
  embeddings_path: "data/embedding/complete_soluble_proteins_embeddings.pkl"
  embedding_dtype: "bf16"
  max_sequence_length: 1024
  
  pretrain:
    train_csv: "data/membrane_protein/splits/pretrain_train.csv"
    valid_csv: "data/membrane_protein/splits/pretrain_validation.csv"
  
  finetune:
    train_csv: "data/membrane_protein/splits/finetune_train.csv"
    valid_csv: "data/membrane_protein/splits/finetune_validation.csv"
  
  evaluate:
    test_balanced: "data/membrane_protein/test_balanced.csv"
    test_realistic: "data/membrane_protein/test_realistic.csv"

model_config:
  model: "tuna"
  input_dim: 1536
  d_model: 64
  intra_layers: 1
  inter_layers: 1
  n_heads: 8
  ff_dim: 256
  dropout: 0.2
  activation: "swish"
  spectral_norm: null
  
  gp_layer:
    rffs: 4096
    out_targets: 1
    gp_cov_momentum: -1
    gp_ridge_penalty: 1
    likelihood_function: 'binary_logistic'

pretrain_config:
  epochs: 14
  batch_size: 32
  log_every_n_batches: 50
  logging_metrics:
    primary: "auroc"
    secondary: "accuracy"
  use_mixed_precision: true
  early_stopping_patience: 5
  monitor_metric: "auroc"
  
  scheduler:
    type: "steplr"
    step_size: 2
    gamma: 0.93
  
  optimizer:
    type: "adam"
    lr: 0.0001
    weight_decay: 0.00001
  
  loss:
    type: "bce_with_logits"
    label_smoothing: 0.0
    use_class_weights: false
    l1_lambda: 0.0

finetune_config:
  strategy:
    type: "staged_unfreeze"  # staged_unfreeze | head_only | full | null (no strategy)
    schedule:
      - at_epoch: 0
        freeze: ["encoder."]
      - at_epoch: 3
        unfreeze: ["encoder."]
  
  epochs: 10
  batch_size: 32
  log_every_n_batches: 50
  logging_metrics:
    primary: "auroc"
    secondary: "accuracy"
  use_mixed_precision: true
  early_stopping_patience: 5
  monitor_metric: "auroc"
  
  scheduler:
    type: "steplr"
    step_size: 2
    gamma: 0.93
  
  optimizer:
    type: "adam"
    lr: 0.0001
    weight_decay: 0.00001
  
  loss:
    type: "bce_with_logits"
    label_smoothing: 0.0
    use_class_weights: false
    l1_lambda: 0.0

evaluate:
  metrics:
    - "auroc"
    - "auprc"
    - "accuracy"
    - "sensitivity"
    - "specificity"
    - "precision"
    - "recall"
    - "f1"
    - "mcc"
