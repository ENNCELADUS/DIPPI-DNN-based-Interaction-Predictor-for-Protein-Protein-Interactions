run_config:
  mode: "full_pipeline"  # full_pipeline | train_only | eval_only
  seed: 47
  train_run_id: null
  finetune_run_id: null
  eval_run_id: null
  load_checkpoint_path: null
  save_best_only: true

device_config:
  device: "cuda"
  ddp_enabled: true
  use_mixed_precision: true

data_config:
  sequences:
    source_file: "data/TMP/processed/all_proteins.csv"
    id_column: "uniprotID"
    sequence_column: "sequence"
  dataloader:
    train_dataset: "data/TMP/processed/pretrain_train_balanced.csv"
    valid_dataset: "data/TMP/processed/pretrain_val_balanced.csv"
    finetune_train_dataset: "data/TMP/processed/finetune_train.csv"
    finetune_val_dataset: "data/TMP/processed/finetune_val.csv"
    test_dataset: "data/TMP/processed/test.csv"
    num_workers: 0
    pin_memory: false
    drop_last: false
    sampling:
      strategy: "none"  # none | ohem

model_config:
  model: "v6"
  input_dim: 1536
  d_model: 512
  cross_attn_layers: 2
  n_heads: 8
  esm3:
    model_name: "esm3-open"
    checkpoint_path: "models/esm3/esm3_sm_open_v1_full.pth"
    strip_cls_eos: true
    embed_batch_size: 64
    combine_pairs: true
  lora:
    last_n_layers: 8
    target_modules: ["layernorm_qkv", "out_proj", "ffn"]
    r: 8
    alpha: 16
    dropout: 0.05
  mlp_head:
    dropout: 0.10
  regularization:
    dropout: 0.10
    cross_attention_dropout: 0.10
    projection_dropout: 0.05

training_config:
  epochs: 10
  batch_size: 8
  early_stopping_patience: 5
  monitor_metric: "auprc"
  logging:
    validation_metrics: ["auprc", "auroc", "f1", "accuracy"]
  optimizer:
    type: "adamw"
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.01
  scheduler:
    type: "onecycle"
    max_lr: 0.0002
    pct_start: 0.10
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.02
  strategy:
    type: "none"
  finetune:
    epochs: 20
    monitor_metric: "auprc"
    optimizer:
      lr: 0.00005
    loss:
      pos_weight: 7.0
      label_smoothing: 0.01
    strategy:
      type: "none"

evaluate:
  metrics:
    - "auroc"
    - "auprc"
    - "accuracy"
    - "sensitivity"
    - "specificity"
    - "precision"
    - "recall"
    - "f1"
    - "mcc"
