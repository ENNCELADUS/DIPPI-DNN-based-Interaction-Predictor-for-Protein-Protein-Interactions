# PLM-interact runner config (eval or finetune+eval)

run_config:
  mode: "eval_only"           # eval_only | finetune_eval
  seed: 42
  device: "cuda"
  run_id: null                # auto timestamp if null
  log_dir: null               # defaults to logs/plm_interact/{mode}/{run_id}
  checkpoint_dir: null        # defaults to models/plm_interact/{run_id}

model_config:
  base_model_path: "models/PLM-interact-650M-humanV11"  # local HF snapshot
  checkpoint_path: "models/PLM-interact-650M-humanV11/pytorch_model.bin"
  embedding_size: 1280
  classifier_dropout: 0.1
  pos_weight: 3.0
  max_length: 1603

data_config:
  # CSVs must have columns: query, text, label
  train_csv: "data/TMP_protein/processed/pair-no-leakage/plm_interact/finetune_train.csv"
  val_csv: "data/TMP_protein/processed/pair-no-leakage/plm_interact/finetune_val.csv"
  test_balanced_csv: "data/TMP_protein/processed/pair-no-leakage/plm_interact/test_balanced.csv"
  test_realistic_csv: "data/TMP_protein/processed/pair-no-leakage/plm_interact/val_balanced.csv"
  dataloader:
    num_workers: 2
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    drop_last: false

train_config:
  epochs: 1
  batch_size_train: 32
  batch_size_eval: 32
  lr: 2.0e-5
  weight_decay: 0.01
  grad_accum_steps: 8
  max_grad_norm: 1.0
  use_amp: true
  num_workers: 0

evaluate:
  metrics: [
    "auroc",
    "auprc",
    "accuracy",
    "sensitivity",
    "specificity",
    "precision",
    "recall",
    "f1",
    "mcc",
  ]
  monitor_metric: "auprc"
  classification_threshold: 0.5
