# V5 Config - Ablation with contact map modeling

run_config:
  mode: "full_pipeline"  # full_pipeline | finetune_from_pretrain | eval_only
  seed: 47
  pretrain_run_id: null   # Auto-timestamp if null
  finetune_run_id: null   # Auto-timestamp if null
  eval_run_id: null      # Auto-timestamp if null
  load_checkpoint_path: null  # Start fresh with new architecture
  save_best_only: true     # If true, only save the best checkpoint.

top_level_config:
  device: "cuda"
  ddp:
    enabled: true         # Enable DistributedDataParallel by default
    backend: "nccl"       # nccl | gloo (cpu)
    init_method: "env://"
    find_unused_parameters: false # Enable only if model branches leave parameters unused.

data_config:
  embeddings_path: "data/TMP/processed/TMP_embeddings.npz"
  embedding_dtype: "bf16"
  max_sequence_length: 768
  dataloader:
    num_workers: 0
    prefetch_factor: null
    persistent_workers: false
    pin_memory: false
    drop_last: false

  pretrain:
    train_csv: "data/TMP/processed/pretrain_train_balanced.csv"
    valid_csv: "data/TMP/processed/pretrain_val_balanced.csv"
  finetune:
    train_csv: "data/TMP/processed/finetune_train.csv"
    valid_csv: "data/TMP/processed/finetune_val.csv"
    sampling:
      strategy: "staged_hard"
      pos_neg_ratio: 16.0
      warmup_epochs: 2
      hard_ratio: 0.7
      hard_score_col: "hard_score"
      online_mining: true
      candidate_multiplier: 8
      ema_alpha: 0.2
      hard_score_quantile_low: 0.9
      hard_score_quantile_high: 0.995
      score_batch_size: 256
  evaluate:
    test_balanced: "data/TMP/processed/test.csv"

model_config:
  model: "v5"
  input_dim: 1536
  d_model: 384
  encoder_layers: 2
  cross_attn_layers: 2
  n_heads: 12

  # Contact map modeling parameters
  pair_dim: 128
  cnn_dim: 64

  # MLP head configuration (input is cnn_dim after global max pool)
  mlp_head:
    hidden_dims: [64]
    dropout: 0.25
    activation: "gelu"
    norm: "layernorm"

  # Architecture related regularization
  regularization:
    dropout: 0.20
    token_dropout: 0.20
    cross_attention_dropout: 0.15
    stochastic_depth: 0.15

pretrain_config:
  epochs: 40
  batch_size: 32
  
  # Logging configuration
  log_every_n_batches: 100   # More frequent logging to see progress
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auprc
    secondary: auroc
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: true
  
  # Early stopping
  early_stopping_patience: 5
  monitor_metric: "auprc"     # Which metric to use for early stopping (lower is better)
  max_grad_norm: 1.0
  
  # Scheduler settings.
  scheduler:
    type: "onecycle"
    max_lr: 0.00005
    pct_start: 0.20
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
  
  # Optimizer
  optimizer:
    type: "adamw"
    lr: 0.00005
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.015
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.02
    use_class_weights: true
    l1_lambda: 0.0

finetune_config:
  strategy:
    type: "staged_unfreeze"  # head_only | full | staged_unfreeze
    schedule:
      # Head-only warmup: freeze encoder and interaction-map modules
      - at_epoch: 0
        freeze: ["encoder.", "cross_attention.", "map_builder.", "contact_cnn."]
      # Unfreeze contact-map modules first
      - at_epoch: 3
        unfreeze: ["map_builder.", "contact_cnn."]
      # Unfreeze encoder last
      - at_epoch: 5
        unfreeze: ["encoder."]

  epochs: 30
  batch_size: 32

  # Logging configuration
  log_every_n_batches: 50
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auprc
    secondary: auroc
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: true
  
  # Early stopping
  early_stopping_patience: 5
  monitor_metric: "auprc"     # Which metric to use for early stopping (lower is better)
  max_grad_norm: 1.0
  
  scheduler:
    type: "warmup_cosine"
    warmup_epochs: 3
    num_cycles: 0.5
  
  # Optimizer with LLRD (Layer-wise Learning Rate Decay)
  # Note: Schedulers (e.g., warmup_cosine) apply to all param_groups uniformly
  optimizer:
    type: "adamw"
    lr: 0.000005               # Base LR for unmatched parameters
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.02         # Base weight_decay for unmatched parameters
    # LLRD: Different learning rates for different model components
    param_groups:
      - name: "head"
        pattern: "output_head."
        lr: 0.000020
        weight_decay: 0.01
      - name: "contact_cnn"
        pattern: "contact_cnn."
        lr: 0.000010
        weight_decay: 0.02
      - name: "map_builder"
        pattern: "map_builder."
        lr: 0.000010
        weight_decay: 0.02
      - name: "cross_attention"
        pattern: "cross_attention."
        lr: 0.000008
        weight_decay: 0.02
      - name: "encoder"
        pattern: "encoder."
        lr: 0.000005
        weight_decay: 0.03
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 16.0
    label_smoothing: 0.005
    use_class_weights: true
    l1_lambda: 0.0
  
evaluate:
  metrics: [
    "auroc",
    "auprc",
    "accuracy",
    "sensitivity",
    "specificity",
    "precision",
    "recall",
    "f1",
    "mcc",
  ]
  apply_distribution_alignment: false
