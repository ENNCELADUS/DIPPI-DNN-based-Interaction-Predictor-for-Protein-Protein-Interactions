# Example configuration showing all available keys for DIPPI pipeline stages.
# Copy and trim as needed for specific runs.

run_config:
  mode: "full_pipeline"            # full_pipeline | pretrain_only | finetune_from_pretrain | eval_only
  seed: 47
  pretrain_run_id: null            # Auto-generated if null
  finetune_run_id: null            # Auto-generated if null
  eval_run_id: null                # Auto-generated if null
  load_checkpoint_path: null       # Required for eval_only
  save_best_only: true

top_level_config:
  device: "cuda"
  ddp:
    enabled: true
    backend: "nccl"                # nccl | gloo
    init_method: "env://"
    find_unused_parameters: false

data_config:
  embeddings_path: "data/TMP/processed/TMP_embeddings.npz"
  embedding_dtype: "bf16"          # bf16 | fp16 | fp32
  max_sequence_length: 768
  curve_thresholds: 200            # Optional: AUROC/AUPRC curve thresholds for eval
  dataloader:
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    drop_last: false

  pretrain:
    train_csv: "data/TMP/processed/pretrain_train_balanced.csv"
    valid_csv: "data/TMP/processed/pretrain_val_balanced.csv"
    sampling:                       # Optional class-balanced sampling for batches
      strategy: "imbalanced"        # imbalanced | none
      pos_neg_ratio: 1.0

  finetune:
    train_csv: "data/TMP/processed/finetune_train.csv"
    valid_csv: "data/TMP/processed/finetune_val.csv"
    sampling:                       # Optional; remove if using natural ratio
      strategy: "imbalanced"
      pos_neg_ratio: 10.0
    distribution_alignment:         # Optional test-time DA search during finetune
      target_prior: 0.10
      threshold_search_metric: "auprc"
      search_steps: 200

  evaluate:
    test_balanced: "data/TMP/processed/test.csv"
    test_realistic: null            # Optional additional test split

model_config:
  model: "v3"                       # v1 | v2 | v3 | v4 | v5 | tuna
  input_dim: 1536
  d_model: 256
  encoder_layers: 4
  cross_attn_layers: 2
  n_heads: 8
  pooling: "mean"                  # mean | cls | concat
  mlp_head:
    hidden_dims: [512, 256]
    dropout: 0.10
    activation: "gelu"
    norm: "layernorm"
  regularization:
    dropout: 0.1
    token_dropout: 0.05
    cross_attention_dropout: 0.05
    stochastic_depth: 0.02
    layernorm_eps: 1.0e-5

pretrain_config:
  strategy:
    type: "full"                    # head_only | full | staged_unfreeze
    schedule: []                    # For staged_unfreeze: list of {at_epoch, freeze/unfreeze}
  epochs: 30
  batch_size: 32
  log_every_n_batches: 100
  logging_metrics:
    primary: "auprc"
    secondary: "auroc"
  use_mixed_precision: true
  early_stopping_patience: 5
  monitor_metric: "loss"
  gradient_clip_norm: null          # Optional float
  scheduler:
    type: "onecycle"                # onecycle | cosine | step | none
    max_lr: 0.0001
    pct_start: 0.20
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
    step_size: null                 # For step scheduler
    gamma: null
  optimizer:
    type: "adamw"                   # adamw | adam | sgd
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.01
    momentum: null                  # For SGD
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.02
    use_class_weights: true
    l1_lambda: 0.0

finetune_config:
  strategy:
    type: "staged_unfreeze"         # head_only | full | staged_unfreeze
    schedule:
      - at_epoch: 0
        freeze: ["protein_encoder."]
      - at_epoch: 3
        unfreeze: ["protein_encoder."]
  epochs: 15
  batch_size: 32
  log_every_n_batches: 50
  logging_metrics:
    primary: "auprc"
    secondary: "auroc"
  use_mixed_precision: true
  early_stopping_patience: 5
  monitor_metric: "loss"
  gradient_clip_norm: null
  scheduler:
    type: "onecycle"
    max_lr: 0.00005
    pct_start: 0.30
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
  optimizer:
    type: "adamw"
    lr: 0.00005
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.01
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.0
    use_class_weights: true
    l1_lambda: 0.0

evaluate:
  metrics: ["auroc", "auprc", "f1", "precision", "recall", "accuracy", "mcc"]
  classification_threshold: 0.5
  apply_distribution_alignment: false   # If true and checkpoint has DA params, apply them
