# V3 Config

run_config:
  mode: "full_pipeline"  # full_pipeline | finetune_from_pretrain | eval_only
  seed: 42
  pretrain_run_id: "test_e2e_pretrain"
  finetune_run_id: "test_e2e_finetune"
  eval_run_id: "test_e2e_eval"
  load_checkpoint_path: null             # If mode = full_pipeline, then NULL checkpoint.
                                        # If mode = finetune_from_pretrain, then the checkpoint of the pretrain run.
                                        # If mode = eval_only, then the checkpoint of the finetune run.
  save_best_only: true     # If true, only save the best checkpoint. If not, save checkpoint at every epoch end, while also keeps a best model checkpoint.

top_level_config:
  device: "cuda"
  ddp:
    enabled: false         # Enable DistributedDataParallel by default
    backend: "nccl"       # nccl | gloo (cpu)
    init_method: "env://"
    find_unused_parameters: false # Enable only if model branches leave parameters unused.

data_config:
  embeddings_path: "data/test_e2e/embedding/test_embeddings.pkl"
  embedding_dtype: "fp32"
  max_sequence_length: 256
  dataloader:
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    drop_last: false

  # Dataset splits
  pretrain:
    train_csv: "data/test_e2e/splits/pretrain_train.csv"
    valid_csv: "data/test_e2e/splits/pretrain_validation.csv"
    sampling:
      strategy: "imbalanced"
      pos_neg_ratio: 3.0
  finetune:
    train_csv: "data/test_e2e/splits/finetune_train.csv"
    valid_csv: "data/test_e2e/splits/finetune_validation.csv"
    sampling:
      strategy: "imbalanced"
      pos_neg_ratio: 3.0
    distribution_alignment:
      target_prior: 0.5
      threshold_search_metric: "f1"
      search_steps: 100
  evaluate:
    test_balanced: "data/test_e2e/test_balanced.csv"
    test_realistic: "data/test_e2e/test_realistic.csv"

model_config:
  model: "v3"
  input_dim: 1536
  d_model: 64
  encoder_layers: 1
  cross_attn_layers: 1
  n_heads: 2

  # MLP head configuration
  mlp_head:
    hidden_dims: [64, 32]
    dropout: 0.10
    activation: "gelu"
    norm: "layernorm"

  # Architecture related regularization (MVP)
  regularization:
    dropout: 0.05                   # Required: transformer block dropout
    token_dropout: 0.05             # Optional: dropout on embeddings before encoder (0.0 = disabled)
    cross_attention_dropout: 0.05   # Optional: dropout for cross-attention
    stochastic_depth: 0.02          # Max drop-path rate across encoder depth (linear schedule)

pretrain_config:
  epochs: 2
  batch_size: 4

  # Logging configuration
  log_every_n_batches: 1
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auroc
    secondary: recall
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: false
  
  # Early stopping
  early_stopping_patience: 2
  monitor_metric: "loss"     # Which metric to use for early stopping (lower is better)
  
  # Scheduler settings.
  scheduler:
    type: "onecycle"
    max_lr: 0.00006
    pct_start: 0.20
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
  
  # Optimizer
  optimizer:
    type: "adamw"
    lr: 0.00006
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.015
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 3.0
    label_smoothing: 0.03
    use_class_weights: true
    l1_lambda: 2.0e-6         # Small L1 penalty on weights (tunes sparsity; keep small)

finetune_config:
  strategy:
    type: "staged_unfreeze"  # head_only | full | staged_unfreeze
    schedule:
      # Initial freeze: start finetune with encoder frozen (head-only training)
      - at_epoch: 0
        freeze: ["encoder."]
      # Staged unfreeze: unfreeze encoder after 3 epochs
      - at_epoch: 3
        unfreeze: ["encoder."]
        # Optional: could specify new optimizer_cfg/scheduler_cfg here for different LRs

  epochs: 2
  batch_size: 4

  # Logging configuration
  log_every_n_batches: 1
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auroc
    secondary: recall
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: false
  
  # Early stopping
  early_stopping_patience: 2
  monitor_metric: "loss"     # Which metric to use for early stopping (lower is better)
  
  scheduler:
    type: "warmup_cosine"
    warmup_epochs: 0
    num_cycles: 0.5
  
  # Optimizer with LLRD (Layer-wise Learning Rate Decay)
  # Note: Schedulers (e.g., warmup_cosine) apply to all param_groups uniformly
  optimizer:
    type: "adamw"
    lr: 0.00001                # Base LR for unmatched parameters
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.01         # Base weight_decay for unmatched parameters
    # LLRD: Different learning rates for different model components
    param_groups:
      - name: "head"
        pattern: "output_head."
        lr: 0.000035
        weight_decay: 0.0      # No weight decay on task head
      - name: "cross_attention"
        pattern: "cross_attention."
        lr: 0.000025
        weight_decay: 0.01
      - name: "encoder"
        pattern: "encoder."
        lr: 0.000015           # Lower LR for pretrained encoder (LLRD)
        weight_decay: 0.015
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 2.0
    label_smoothing: 0.01
    use_class_weights: true
    l1_lambda: 1.0e-6         # Small L1 penalty on weights during finetune
  
evaluate:
  metrics: [
    "auroc",
    "auprc",
    "accuracy",
    "sensitivity",
    "specificity",
    "precision",
    "recall",
    "f1",
    "mcc",
  ]
