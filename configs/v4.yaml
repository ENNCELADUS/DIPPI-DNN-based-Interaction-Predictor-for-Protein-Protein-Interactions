# V4 Config

run_config:
  mode: "full_pipeline"  # full_pipeline | finetune_from_pretrain | eval_only
  seed: 47
  pretrain_run_id: null   # Auto-timestamp if null
  finetune_run_id: null   # Auto-timestamp if null
  eval_run_id: null       # Auto-timestamp if null
  load_checkpoint_path: null  # Start fresh with new architecture
  save_best_only: true     # If true, only save the best checkpoint.

top_level_config:
  device: "cuda"
  ddp:
    enabled: true         # Enable DistributedDataParallel by default
    backend: "nccl"       # nccl | gloo (cpu)
    init_method: "env://"
    find_unused_parameters: false # Enable only if model branches leave parameters unused.

data_config:
  embeddings_path: "data/TMP/processed/TMP_embeddings.npz"
  embedding_dtype: "bf16"
  max_sequence_length: 768
  dataloader:
    num_workers: 0
    prefetch_factor: null
    persistent_workers: false
    pin_memory: false
    drop_last: false

  pretrain:
    train_csv: "data/TMP/processed/pretrain_train_balanced.csv"
    valid_csv: "data/TMP/processed/pretrain_val_balanced.csv"
  finetune:
    train_csv: "data/TMP/processed/finetune_train.csv"
    valid_csv: "data/TMP/processed/finetune_val.csv"
  evaluate:
    test_balanced: "data/TMP/processed/test.csv"

model_config:
  model: "v4"
  input_dim: 1536
  d_model: 384
  encoder_layers: 2           # Now uses v3-style encoder with transformer layers
  cross_attn_layers: 2
  n_heads: 12

  # MLP head configuration (input_dim = 2*d_model = 768 after product|diff)
  mlp_head:
    hidden_dims: [512, 256, 64]
    dropout: 0.20
    activation: "gelu"
    norm: "layernorm"

  # Architecture related regularization
  regularization:
    dropout: 0.15                   # Increased from 0.10 for better regularization
    token_dropout: 0.15             # Increased from 0.10
    cross_attention_dropout: 0.10   # Increased from 0.05
    stochastic_depth: 0.10          # Increased from 0.05 for more regularization

pretrain_config:
  epochs: 40
  batch_size: 32

  # Logging configuration
  log_every_n_batches: 100
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auprc
    secondary: auroc
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: true
  
  # Early stopping
  early_stopping_patience: 5
  monitor_metric: "auprc"     # Which metric to use for early stopping
  
  # Scheduler settings.
  scheduler:
    type: "onecycle"
    max_lr: 0.00005
    pct_start: 0.20
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: "cos"
  
  # Optimizer
  optimizer:
    type: "adamw"
    lr: 0.00005
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.015
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 1.0
    label_smoothing: 0.02
    use_class_weights: true
    l1_lambda: 0.0

finetune_config:
  strategy:
    type: "staged_unfreeze"  # head_only | full | staged_unfreeze
    schedule:
      # Initial freeze: start finetune with encoder frozen (head-only training)
      - at_epoch: 0
        freeze: ["encoder."]
      # Delayed unfreeze: unfreeze encoder after 5 epochs to let head stabilize
      - at_epoch: 5
        unfreeze: ["encoder."]

  epochs: 30
  batch_size: 32

  # Logging configuration
  log_every_n_batches: 100
  logging_metrics:               # Two metrics to log to the training_step.csv file
    primary: auprc
    secondary: auroc
  
  # Mixed precision (AMP) - CUDA only
  use_mixed_precision: true
  
  # Early stopping
  early_stopping_patience: 5
  monitor_metric: "auprc"     # Which metric to use for early stopping (lower is better)
  
  scheduler:
    type: "warmup_cosine"
    warmup_epochs: 3
    num_cycles: 0.5
  
  # Optimizer with LLRD (Layer-wise Learning Rate Decay)
  # Note: Schedulers (e.g., warmup_cosine) apply to all param_groups uniformly
  optimizer:
    type: "adamw"
    lr: 0.00001                # Base LR for unmatched parameters
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.01         # Base weight_decay for unmatched parameters
    # LLRD: Different learning rates for different model components
    param_groups:
      - name: "head"
        pattern: "output_head."
        lr: 0.000025            # Reduced from 0.000035
        weight_decay: 0.01      # Added weight decay to head
      - name: "pool"
        pattern: "pool_"
        lr: 0.000020
        weight_decay: 0.01
      - name: "cross_attention"
        pattern: "cross_attention."
        lr: 0.000018            # Reduced from 0.000025
        weight_decay: 0.015     # Increased from 0.01
      - name: "encoder"
        pattern: "encoder."
        lr: 0.000010            # Reduced from 0.000015
        weight_decay: 0.020     # Increased from 0.015
  # Loss
  loss:
    type: "bce_with_logits"
    pos_weight: 1.3           # Reduced from 1.5
    label_smoothing: 0.03     # Increased from 0.01
    use_class_weights: true
    l1_lambda: 0.0
  
evaluate:
  metrics: [
    "auroc",
    "auprc",
    "accuracy",
    "sensitivity",
    "specificity",
    "precision",
    "recall",
    "f1",
    "mcc",
  ]
  apply_distribution_alignment: false
