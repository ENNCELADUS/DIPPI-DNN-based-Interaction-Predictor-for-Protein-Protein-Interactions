# ML Models Config (Random Forest / XGBoost)

run_config:
  stages: ["finetune", "evaluate"]
  seed: 47
  run_id: null  # Auto-timestamp if null

data_config:
  benchmark:
    name: "TMP"
    root_dir: "data/TMP"
    processed_dir: "data/TMP/processed"
  embeddings:
    source: "esm3"
    cache_dir: "data/embeddings/esm3"
  max_sequence_length: 1024
  preprocessing:
    tppni:
      enabled: true
      force_rebuild: false
      candidate_limit: 10000000
      pretrain:
        source_dataset: "data/TMP/processed/pretrain.csv"
        train_ratio: 0.95
        train_dataset: "data/TMP/processed/pretrain_train_tppni.csv"
        valid_dataset: "data/TMP/processed/pretrain_val_tppni.csv"
      finetune:
        source_dataset: "data/TMP/processed/finetune.csv"
        train_ratio: 0.90
        train_dataset: "data/TMP/processed/finetune_train_tppni.csv"
        valid_dataset: "data/TMP/processed/finetune_val_tppni.csv"
  dataloader:
    train_dataset: "data/TMP/processed/pretrain_train_tppni.csv"
    valid_dataset: "data/TMP/processed/pretrain_val_tppni.csv"
    finetune_train_dataset: "data/TMP/processed/finetune_train_tppni.csv"
    finetune_val_dataset: "data/TMP/processed/finetune_val_tppni.csv"
    test_dataset: "data/TMP/processed/test.csv"
    num_workers: 2
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    drop_last: false

  # Feature extraction
  pooling: "mean"  # mean | cls

  # Balance train/val by undersampling negatives to 1:1 ratio
  balance: false

model_config:
  # Model selector: "random_forest" or "xgboost"
  model: "xgboost"
  input_dim: 1536

  # Random Forest parameters
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_split: 10
    min_samples_leaf: 5
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1
    verbose: 1
  
  # XGBoost parameters
  xgboost:
    n_estimators: 300
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    gamma: 0.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    scale_pos_weight: null  # Set automatically based on class imbalance if null
    n_jobs: -1
    verbosity: 1
    # Early stopping (optional)
    early_stopping_rounds: 10

evaluate:
  metrics:
    - auroc
    - auprc
    - accuracy
    - precision
    - recall
    - sensitivity
    - specificity
    - f1
    - mcc
  threshold: 0.5  # Decision threshold for binary classification
